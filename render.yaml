services:
  - type: web
    name: storybook-app
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20
      - key: FLASK_ENV
        value: production
      - key: NODE_ENV
        value: production
    autoDeploy: false